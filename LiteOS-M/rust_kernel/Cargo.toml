[package]
name = "RustCompileTest"
version = "0.1.0"
edition = "2021"

[lib]
name = "los_sched_lib"
crate-type = ["staticlib"]
path = "src/los_sched.rs"

# ---------------------------------------------------------------------------
# Feature flags that mirror the LOSCFG_* flags in los_config.h.  For the
# configuration in your uploaded los_config_h.rs:
#   LOSCFG_BASE_CORE_SWTMR        = 1  -> "swtmr"
#   LOSCFG_KERNEL_PM              = 0  -> off
#   LOSCFG_DEBUG_TOOLS            = 0  -> off
#   LOSCFG_BASE_CORE_TSK_MONITOR  = 0  -> off
# `default_hook_shims` keeps the build linkable until you supply
# los_sched_hooks.c (the five-line C trampoline file).  Turn it off in
# production.
# ---------------------------------------------------------------------------
[features]
default = ["swtmr", "default_hook_shims"]
swtmr              = []
kernel_pm          = []
debug_tools        = []
tsk_monitor        = []
default_hook_shims = []

# `panic = "abort"` is required for no_std crates; without it rustc will
# complain "unwinding panics are not supported without std".  Set on BOTH
# dev and release so plain `cargo build` and `cargo build --release` both
# work.
[profile.dev]
panic = "abort"

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
